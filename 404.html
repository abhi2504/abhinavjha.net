<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>404 — Abhinav Jha</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      padding: 2rem var(--pad-x);
      position: relative; z-index: 2;
    }
    .nf-inner { text-align: center; max-width: 32rem; }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 0.75rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--fg-muted);
      margin: 0 0 1rem;
    }
    .nf-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.03em; line-height: 1.05;
      font-weight: 600; margin: 0 0 1rem;
    }
    .nf-sub { color: var(--fg-dim); margin: 0 0 2rem; }
    .nf-back {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.1rem; border: 1px solid var(--line-strong);
      border-radius: 999px; font-family: var(--font-mono);
      font-size: 0.8125rem; color: var(--fg);
      transition: background 250ms var(--ease), border-color 250ms var(--ease);
    }
    .nf-back:hover { background: rgba(255,255,255,0.04); border-color: var(--fg); }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf-inner">
      <p class="nf-code">404 — not found</p>
      <h1 class="nf-title">This page wandered off.</h1>
      <p class="nf-sub">The link might be broken, or the page may have moved.</p>
      <a class="nf-back" href="/">&larr; Back home</a>
    </div>
  </main>
</body>
</html>
